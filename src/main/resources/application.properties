spring.application.name=FaceRecognitionAttendanceSystem

# ==================== DATASOURCE (H2 file, default) ====================
# Switch to MySQL with:  --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/school_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.pool-name=fras-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
# Keep SQL out of the console by default; flip to true while debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Never keep a JPA session open for the whole HTTP request: it hides
# lazy-loading bugs and holds a connection for the duration of the response.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# The H2 web console is a full SQL shell over the live database.
# It is OFF by default; enable it deliberately for local debugging:
#   FRAS_H2_CONSOLE=true mvn spring-boot:run -Dspring-boot.run.mainClass=com.school.school_management_system.SchoolManagementSystemApplication
spring.h2.console.enabled=${FRAS_H2_CONSOLE:false}
spring.h2.console.settings.web-allow-others=false

# ==================== JSON ====================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ==================== SERVER ====================
server.port=8080
# Do not leak stack traces or internal messages to API clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==================== AUTH / JWT ====================
# Signing secret. Supply at least 32 characters via the environment:
#   export FRAS_JWT_SECRET="$(openssl rand -base64 48)"
# If left blank a random key is generated at startup, which is safe but
# invalidates every issued token whenever the backend restarts.
app.jwt.secret=${FRAS_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Brute-force protection on /auth/login.
app.security.max-login-attempts=5
app.security.login-lockout-minutes=15

# Self-service registration always creates a STUDENT account. To let
# someone register as TEACHER or ADMIN from the sign-up form they must
# also supply this code. Blank (the default) disables privileged
# self-registration entirely - use the admin-only POST /auth/users instead.
app.security.privileged-registration-code=${FRAS_REGISTRATION_CODE:}

# ==================== FIRST-RUN BOOTSTRAP ====================
# Creates this administrator only when the users table is empty, so an
# operator can always get in on a fresh database. Override the password
# via FRAS_ADMIN_PASSWORD; the generated one is printed to the log once.
app.bootstrap.enabled=true
app.bootstrap.admin-email=${FRAS_ADMIN_EMAIL:admin@fras.local}
app.bootstrap.admin-password=${FRAS_ADMIN_PASSWORD:}
# Seed a demo department/semester/subject/classroom when those tables are
# empty, so the attendance screens have something to point at on day one.
app.bootstrap.sample-academic-data=true

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.fras=INFO
logging.level.com.attendance=INFO
logging.level.com.school=INFO
logging.level.org.hibernate.SQL=WARN
