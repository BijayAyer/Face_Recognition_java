# MySQL profile: run with --spring.profiles.active=mysql
#
# One-time setup:
#   CREATE DATABASE school_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#   CREATE USER 'fras'@'localhost' IDENTIFIED BY '<password>';
#   GRANT ALL PRIVILEGES ON school_db.* TO 'fras'@'localhost';
#
# Credentials come from the environment so they are never committed.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:school_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# The H2 console is meaningless against MySQL.
spring.h2.console.enabled=false
