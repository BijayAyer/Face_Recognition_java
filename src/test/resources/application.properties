# Tests run against a throwaway in-memory database.
spring.datasource.url=jdbc:h2:mem:school_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

app.jwt.secret=test-only-secret-key-do-not-use-in-prod-please-change
app.jwt.expiration-ms=3600000

app.security.max-login-attempts=5
app.security.login-lockout-minutes=15
app.security.privileged-registration-code=

# Deterministic credentials for integration tests; no random password.
app.bootstrap.enabled=true
app.bootstrap.admin-email=admin@fras.test
app.bootstrap.admin-password=test-admin-password
app.bootstrap.sample-academic-data=false

logging.level.org.hibernate.SQL=WARN
